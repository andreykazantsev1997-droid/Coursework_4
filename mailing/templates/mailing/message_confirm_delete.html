{% extends 'mailing/base.html' %}
{% block content %}
<div class="container">
        <h1 class="mb-4">Удалить сообщение</h1>
        <p>Вы уверены, что хотите удалить "{{ object.topic }}?"</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Удалить</button>
            <a href="{% url 'mailing:messages' %}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
{% endblock %}
