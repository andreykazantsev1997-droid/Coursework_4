<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Управление рассылками{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
</head>
<body>
<div class="d-flex flex-column flex-md-row align-items-center p-3 px-md-4 mb-3 bg-white border-bottom box-shadow">
    <h5 class="my-0 mr-md-auto font-weight-normal">Управление рассылками</h5>
    <nav class="my-2 my-md-0 mr-md-3">
        <a class="btn btn-outline-primary btn-sm mx-1" href="{% url 'mailing:clients' %}">Клиенты</a>
        <a class="btn btn-outline-primary btn-sm mx-1" href="{% url 'mailing:messages' %}">Сообщения</a>
        <a class="btn btn-outline-primary btn-sm mx-1" href="{% url 'mailing:mailings' %}">Рассылки</a>
    </nav>

</div>

<div class="pricing-header px-3 py-3 pt-md-5 pb-md-4 mx-auto text-center">
    <h1 class="display-4"></h1>
    <p class="lead"></p>
</div>
<div class="container">
    {% block content %}
    {% endblock %}
</div>
    <footer class="pt-4 my-md-5 pt-md-5 border-top">
        <div class="row">
            <div class="col-6 col-md">
            </div>
        </div>
    </footer>
    <script src="/static/js/bootstrap.bundle.min.js"></script
</body>
</html>
