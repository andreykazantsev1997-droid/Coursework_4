{% extends 'mailing/base.html' %}
{% block content %}
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Список сообщений</h2>
        <a href="{% url 'mailing:message_create' %}" class="btn btn-primary">Добавить сообщение</a>
    </div>
    <table class="table table-striped table-hover border">
        <thead class="table-dark">
            <tr>
                <th>Тема сообщения</th>
                <th>Управление</th>
            </tr>
        </thead>
        <tbody>
            {% for object in object_list %}
            <tr>
                <td>{{ object.topic }}</td>
                <td class="text-end">
                    <a href="{% url 'mailing:messages_edit' object.pk %}" class="btn btn-warning btn-sm">Редактировать</a>
                    <a href="{% url 'mailing:messages_delete' object.pk %}" class="btn btn-danger btn-sm">Удалить</a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="2" class="text-center text-muted">Список сообщений пока пуст</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
